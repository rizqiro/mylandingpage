<!--
  ICON SPRITE
  Every icon used on the site lives here once, as a <symbol>, instead of
  being repeated inline throughout index.html.

  script.js fetches this file on page load and inlines it (hidden) into
  <body>, so every icon in index.html can just reference a local
  fragment:

    <svg class="icon"><use href="#icon-name"></use></svg>

  (Browsers are unreliable about resolving <use> directly against a
  *separate* SVG file, so the fetch-and-inline step is what makes that
  short #icon-name form work everywhere.)

  The class (.icon / .icon-sm / .icon-lg, see styles.css) controls size,
  and each icon inherits its color from CSS `color` via `currentColor` --
  same as before, just centralized in one file.

  To add a new icon: paste a new <symbol id="icon-your-name" ...>...
  </symbol> below and reference it the same way.

  Note: because this file is loaded via fetch(), it only works when the
  page is served over http/https (a local static server, or any real
  hosting -- GitHub Pages, Netlify, etc. all work fine), not opened
  directly as a file:// URL. See README.md for a one-line local server
  command.
-->
<svg xmlns="http://www.w3.org/2000/svg">

  <symbol id="icon-arrow-up-right" viewBox="0 0 24 24">
    <path d="M7 17L17 7M17 7H8M17 7V16" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>

  <symbol id="icon-download" viewBox="0 0 24 24">
    <path d="M12 3v12m0 0l-4-4m4 4l4-4M5 21h14" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  </symbol>

